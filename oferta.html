<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santo Doce — Oferta expirada</title>
  <meta name="description" content="Esta oferta não está mais válida. Acesse mais de 100 receitas no Santo Doce." />

  <!-- Fontes da marca -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fredoka:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind + tokens da marca -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>

  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Design System (tokens + componentes) -->
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/components.css" />

  <style>
    /* ============================================================
       CORES ALINHADAS AO PDF (BRUNADESKTOP)
       ============================================================ */
    :root {
      --sd-primary: #004D3A;
      --sd-primary-dark: #004D3A;
      --sd-secondary: #F6B850;
      --sd-secondary-dark: #E5A640;
      --sd-background: #F2E8DE;
      --sd-surface: #F2E8DD;
      --sd-section-white: #FFFBF7;
      --sd-header-bg: #F3E6DC;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--sd-section-white);
    }

    /* Botões dourados — honey + texto verde (PDF) */
    .sd-btn--primary {
      background: var(--sd-secondary);
      color: var(--sd-primary);
      font-weight: 600;
    }
    .sd-btn--primary:hover {
      background: var(--sd-secondary-dark);
      color: var(--sd-primary);
    }
    .sd-btn--primary .sd-icon {
      color: var(--sd-primary);
    }

    /* Botões verdes — hero e receitas (PDF) */
    .sd-btn--secondary {
      background: var(--sd-primary);
      color: var(--sd-white);
    }
    .sd-btn--secondary:hover {
      background: var(--sd-primary-dark);
      color: var(--sd-white);
    }

    /* ============================================================
       HEADER (HERO) — Santo Doce
       ============================================================ */
    .announcement {
      background: var(--sd-primary-dark);
      color: var(--sd-white);
      text-align: center;
      font-size: var(--sd-fs-body-sm);
      font-weight: 500;
      padding: 10px 24px;
    }
    .announcement__inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      line-height: 1.4;
    }
    .announcement__inner i,
    .announcement__inner svg {
      color: var(--sd-secondary);
      width: 18px;
      height: 18px;
      flex: none;
    }
    .announcement strong { font-weight: 700; letter-spacing: 0.01em; }

    .header {
      position: relative;
      background: var(--sd-header-bg);
      overflow: visible;
      z-index: 1;
    }

    .header__grid {
      display: flex;
      justify-content: center;
      padding: 64px 24px 80px;
    }

    .header__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 640px;
      text-align: center;
    }

    .header__logo {
      display: inline-flex;
      width: fit-content;
      text-decoration: none;
    }
    .header__logo-mark {
      display: block;
      height: clamp(64px, 10vw, 88px);
      width: auto;
    }

    .header__title {
      font-family: var(--sd-font-body);
      font-weight: 600;
      font-size: clamp(1.375rem, 3.2vw, 1.875rem);
      line-height: 1.4;
      color: var(--sd-text-primary);
      margin: 0;
    }
    .header__title strong { color: var(--sd-primary); font-weight: 700; }

    .header__cta {
      width: fit-content;
      margin-top: 4px;
    }
    .header__cta i { color: var(--sd-secondary); }
    .header__cta:hover {
      background: #003D2E;
      color: var(--sd-white);
      box-shadow: var(--sd-shadow-md);
    }
    .header__cta:hover i {
      color: var(--sd-secondary);
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .site-footer {
      background: var(--sd-primary-dark);
      color: rgba(255, 255, 255, 0.72);
      text-align: center;
      padding: var(--sd-space-6) var(--sd-space-4);
      font-size: var(--sd-fs-caption);
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <!-- ============ BARRA DE OFERTA ============ -->
  <div class="announcement">
    <span class="announcement__inner">
      <i data-lucide="flame"></i>
      <span><strong>Oferta especial:</strong> Oferta Expirada.</span>
    </span>
  </div>

  <!-- ============ HEADER / HERO ============ -->
  <header class="header">
    <div class="ds-container header__grid">

      <div class="header__content">
        <a class="header__logo" href="index.html" aria-label="Santo Doce — início">
          <img
            class="header__logo-mark"
            src="assets/img/logos/principal/principal-verde-medio.png"
            alt="Santo Doce"
            width="200"
            height="93"
          />
        </a>

        <h1 class="header__title">
          Esta oferta <strong>não está mais válida</strong>, mas você ainda pode adquirir seu acesso a mais de 100 receitas hoje mesmo.
          Clique no botão abaixo para continuar.
        </h1>

        <a
          href="https://www.cursosantodoce.com/"
          class="sd-btn sd-btn--secondary sd-btn--lg header__cta"
        >
          <i data-lucide="arrow-right" class="sd-icon"></i>
          Ir para a página agora
        </a>
      </div>

    </div>
  </header>

  <footer class="site-footer">
    <p>© 2026 · Santo Doce · Todos os direitos reservados</p>
  </footer>

  <script src="assets/js/design-system.js"></script>
</body>
</html>
